    <script>
      try {
        const saved = JSON.parse(localStorage.getItem("raha-state-v1") || "{}");
        const selected = saved.theme || "system";
        const resolved =
          selected === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : selected;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.dataset.motion = saved.motionEnabled === false ? "off" : "on";
        document.documentElement.dataset.fun = saved.funEnabled === false ? "off" : "on";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
